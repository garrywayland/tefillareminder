name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: DavenReminder-watch-apk, path: app/build/outputs/apk/debug/app-debug.apk }
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle :phone:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: DavenReminder-phone-apk, path: phone/build/outputs/apk/debug/phone-debug.apk }
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle :calendar:test
